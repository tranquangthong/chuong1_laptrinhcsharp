using System;

class Program
{
    static void Main()
    {
        Console.Write("Nhập n: ");
        int n = int.Parse(Console.ReadLine());

        int tong_141 = 0;
        for (int i = 1; i <= n; i++)
        {
            tong_141 += i;
        }

        Console.WriteLine($"Tổng S = {tong_141}");
    }
}
